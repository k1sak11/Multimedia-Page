<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Multimedia Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Multimedia Page</h1>
    </header>

    <main>

        <section class="media-section">
            <h2>Favourite Photo</h2>

            <div class="photos">
                <img src="solo.jfif" alt="Favourite Photo 1">
                <img src="solo.jfif" alt="Favourite Photo 2">
                <img src="solo.jfif" alt="Favourite Photo 3">
                <img src="solo.jfif" alt="Favourite Photo 4">
                <img src="solo.jfif" alt="Favourite Photo 5">
            </div>
        </section>

        <section class="media-section">
            <h2>Favourite Audio</h2>

            <div class="audios">
                <audio controls>
                    <source src="Tokyo Ghoul Opening Unravel by TK from Ling Toshite Sigure.mp3" type="audio/mpeg">
                </audio>

            </div>
        </section>

        <section class="media-section">
            <h2>Favourite Videos</h2>

            <div class="videos">
                <video controls>
                    <source src="🌸 Discover the Magic of Hanami – Japan's Cherry Blossom Festival! 🌸.mp4" type="video/mp4">
                </video>

            </div>
        </section>

    </main>

</body>
</html>
