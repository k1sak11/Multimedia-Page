<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Multimedia Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Multimedia Page</h1>
    </header>

    <main>

        <section class="media-section">
            <h2>Favourite Photo</h2>

            <div class="photos">
                <img src="photo1.jpg" alt="Favourite Photo 1">
                <img src="photo2.jpg" alt="Favourite Photo 2">
                <img src="photo3.jpg" alt="Favourite Photo 3">
                <img src="photo4.jpg" alt="Favourite Photo 4">
                <img src="photo5.jpg" alt="Favourite Photo 5">
            </div>
        </section>

        <section class="media-section">
            <h2>Favourite Audio</h2>

            <div class="audios">
                <audio controls>
                    <source src="audio1.mp3" type="audio/mpeg">
                </audio>

                <audio controls>
                    <source src="audio2.mp3" type="audio/mpeg">
                </audio>

                <audio controls>
                    <source src="audio3.mp3" type="audio/mpeg">
                </audio>

                <audio controls>
                    <source src="audio4.mp3" type="audio/mpeg">
                </audio>

                <audio controls>
                    <source src="audio5.mp3" type="audio/mpeg">
                </audio>
            </div>
        </section>

        <section class="media-section">
            <h2>Favourite Videos</h2>

            <div class="videos">
                <video controls>
                    <source src="video1.mp4" type="video/mp4">
                </video>

            </div>
        </section>

    </main>

</body>
</html>
